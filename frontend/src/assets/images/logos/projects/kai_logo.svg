<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad)" stroke="#1E293B" stroke-width="3"/>

  <!-- K letter -->
  <g fill="#FFFFFF" stroke="#1E293B" stroke-width="1">
    <!-- Left vertical line of K -->
    <rect x="60" y="50" width="15" height="100" rx="2"/>

    <!-- Upper diagonal of K -->
    <polygon points="75,50 130,50 130,65 90,80 75,65"/>

    <!-- Lower diagonal of K -->
    <polygon points="75,135 90,120 130,135 130,150 75,150"/>
  </g>

  <!-- Subtle inner glow -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
</svg>